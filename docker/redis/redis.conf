# Redis Configuration for RetireOps Development

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory Management
maxmemory 512mb
maxmemory-policy noeviction

# Persistence (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Logging
loglevel notice

# Snapshotting (RDB)
save 900 1
save 300 10
save 60 10000

# Performance
tcp-keepalive 300
timeout 0
