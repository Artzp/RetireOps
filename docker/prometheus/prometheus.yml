# Prometheus Configuration for RetireOps
# @see docs/source-of-truth/01-overview.md

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'retireops-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # RetireOps API metrics
  - job_name: 'retireops-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api'

  # RetireOps Worker metrics
  - job_name: 'retireops-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:3002']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'worker'

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
