# Prometheus Alert Rules for RetireOps
# @see docs/source-of-truth/01-overview.md

groups:
  - name: retireops-alerts
    rules:
      # API Health
      - alert: APIDown
        expr: up{job="retireops-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'RetireOps API is down'
          description: 'The RetireOps API has been down for more than 1 minute.'

      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="retireops-api"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High API latency detected'
          description: '95th percentile latency is above 2 seconds for the last 5 minutes.'

      - alert: APIHighErrorRate
        expr: rate(http_requests_total{job="retireops-api",status=~"5.."}[5m]) / rate(http_requests_total{job="retireops-api"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High API error rate'
          description: 'More than 5% of requests are failing with 5xx errors.'

      # Worker Health
      - alert: WorkerDown
        expr: up{job="retireops-worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'RetireOps Worker is down'
          description: 'The RetireOps Worker has been down for more than 1 minute.'

      - alert: WorkerQueueBacklog
        expr: retireops_worker_queue_length > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Worker queue backlog growing'
          description: 'Worker queue has more than 100 pending jobs for 10 minutes.'

      # Database Health
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'PostgreSQL is down'
          description: 'PostgreSQL database has been down for more than 1 minute.'

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'PostgreSQL high connection usage'
          description: 'PostgreSQL is using more than 80% of available connections.'

      - alert: PostgresSlowQueries
        expr: rate(pg_stat_activity_max_tx_duration{state="active"}[5m]) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Long-running PostgreSQL queries detected'
          description: 'Queries running longer than 60 seconds detected.'

      # Redis Health
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Redis is down'
          description: 'Redis has been down for more than 1 minute.'

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Redis memory usage high'
          description: 'Redis is using more than 90% of configured memory.'

      # System Resources
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'High CPU usage'
          description: 'CPU usage is above 80% for 10 minutes.'

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'High memory usage'
          description: 'Memory usage is above 85% for 10 minutes.'

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Disk space critically low'
          description: 'Less than 10% disk space remaining.'

  - name: calculation-alerts
    rules:
      # Calculation-specific alerts
      - alert: ProjectionCalculationErrors
        expr: rate(retireops_projection_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Projection calculation errors increasing'
          description: 'More than 0.1 projection calculation errors per second.'

      - alert: TaxCalculationTimeout
        expr: histogram_quantile(0.99, rate(retireops_tax_calculation_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Tax calculations taking too long'
          description: '99th percentile tax calculation time is above 5 seconds.'
